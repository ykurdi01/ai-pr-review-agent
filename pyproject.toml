[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Automatisierter Code-Review-Agent fuer GitHub Pull Requests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ykurdi01" }]
dependencies = [
    "anthropic>=0.40.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
pr-review-agent = "pr_review_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
